<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de servicios | Barbería Estilo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
        @layer components {
            .etiqueta { @apply block text-sm text-amber-100; }
            .campo { @apply mt-1 w-full rounded-lg border border-amber-900/60 bg-stone-800 p-2 text-white placeholder-stone-500 focus:border-amber-600 focus:outline-none focus:ring-1 focus:ring-amber-600; }
            .btn { @apply rounded-lg bg-amber-700 px-5 py-2 font-semibold text-amber-50 hover:bg-amber-600 focus:outline-none focus:ring-2 focus:ring-amber-500; }
            .btn-sec { @apply rounded-lg border border-amber-900/60 px-3 py-1 text-sm text-amber-200 hover:bg-stone-800; }
            .tarjeta { @apply relative rounded-xl border border-amber-900/50 bg-stone-900 p-6 shadow-lg shadow-amber-950/40; }
        }
    </style>
</head>
<body class="bg-stone-950 text-stone-100">
    <nav class="border-b border-amber-900/50 bg-stone-900">
        <div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-2 p-4">
            <span class="text-xl font-semibold text-amber-600">Barbería Estilo</span>
            <div class="flex flex-wrap gap-4 text-sm text-stone-300">
                <a href="panel.html" class="hover:text-amber-500">Citas</a>
                <a href="servicios.html" class="font-semibold text-amber-400">Servicios</a>
                <a href="usuarios.html" class="hover:text-amber-500">Usuarios</a>
                <a href="InicioDeSesion.html" class="text-amber-500 hover:text-amber-400">Cerrar sesión</a>
            </div>
        </div>
    </nav>

    <main class="mx-auto max-w-5xl space-y-6 p-4 py-8">
        <header>
            <h1 class="text-2xl font-semibold text-amber-200">Catálogo de servicios</h1>
            <p class="text-sm text-stone-400">Crea, edita y desactiva servicios</p>
        </header>

        <section class="tarjeta">
            <h2 class="text-lg font-semibold text-amber-200">Nuevo servicio</h2>
            <form class="mt-3 grid gap-4 sm:grid-cols-4" novalidate onsubmit="return false">
                <div class="sm:col-span-2">
                    <label for="nombre" class="etiqueta">Nombre</label>
                    <input id="nombre" type="text" placeholder="Ej. Corte clásico" class="campo">
                </div>
                <div>
                    <label for="costo" class="etiqueta">Costo ($)</label>
                    <input id="costo" type="number" min="0" class="campo">
                </div>
                <div>
                    <label for="duracion" class="etiqueta">Duración (min)</label>
                    <input id="duracion" type="number" min="5" step="5" class="campo">
                </div>
                <div class="flex justify-end sm:col-span-4"><button type="submit" class="btn">Guardar servicio</button></div>
            </form>
        </section>

        <section class="tarjeta !p-0 overflow-x-auto">
            <table class="w-full min-w-[560px] text-left text-sm">
                <thead class="border-b border-amber-900/50 text-amber-200">
                    <tr><th class="p-3">Servicio</th><th class="p-3">Costo</th><th class="p-3">Duración</th><th class="p-3">Estado</th><th class="p-3">Acciones</th></tr>
                </thead>
                <tbody class="divide-y divide-stone-800">
                    <tr>
                        <td class="p-3">Corte clásico</td><td class="p-3">$120</td><td class="p-3">30 min</td>
                        <td class="p-3"><span class="rounded-full bg-green-900/40 px-3 py-1 text-xs text-green-300">Activo</span></td>
                        <td class="space-x-2 p-3"><button class="btn-sec">Editar</button><button class="btn-sec">Desactivar</button></td>
                    </tr>
                    <tr>
                        <td class="p-3">Barba</td><td class="p-3">$80</td><td class="p-3">20 min</td>
                        <td class="p-3"><span class="rounded-full bg-green-900/40 px-3 py-1 text-xs text-green-300">Activo</span></td>
                        <td class="space-x-2 p-3"><button class="btn-sec">Editar</button><button class="btn-sec">Desactivar</button></td>
                    </tr>
                    <tr>
                        <td class="p-3">Tinte</td><td class="p-3">$250</td><td class="p-3">60 min</td>
                        <td class="p-3"><span class="rounded-full bg-stone-800 px-3 py-1 text-xs text-stone-400">Inactivo</span></td>
                        <td class="space-x-2 p-3"><button class="btn-sec">Editar</button><button class="btn-sec">Activar</button></td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
