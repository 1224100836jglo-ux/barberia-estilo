{% extends 'base.html' %}
{% block titulo %}Recuperar contraseña{% endblock %}

{% block contenido %}
<main class="mx-auto flex min-h-screen max-w-md flex-col justify-center space-y-6 p-4 py-8">
    <header class="text-center">
        <div class="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-amber-500 text-3xl">💈</div>
        <p class="mt-3 text-2xl font-bold">BARBERÍA <span class="font-serif italic text-amber-500">Estilo</span></p>
    </header>

    <section class="tarjeta">
        <h1 class="text-xl font-semibold">Recuperar contraseña</h1>
        <p class="mt-1 text-sm text-neutral-400">Escribe tu correo y te generaremos un enlace para crear una contraseña nueva.</p>

        <form method="post" class="mt-4 space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label for="correo" class="etiqueta">Correo</label>
                <input id="correo" name="correo" type="email" required autocomplete="email" placeholder="correo@ejemplo.com" class="campo">
            </div>
            <button type="submit" class="btn w-full">Generar enlace</button>
        </form>

        <p class="mt-4 text-sm"><a href="/login" class="text-amber-500 hover:text-amber-400">← Volver a iniciar sesión</a></p>
    </section>
</main>
{% endblock %}
