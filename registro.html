<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | Barbería Estilo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
        @layer components {
            .etiqueta { @apply block text-sm text-amber-100; }
            .campo { @apply mt-1 w-full rounded-lg border border-amber-900/60 bg-stone-800 p-2 text-white placeholder-stone-500 focus:border-amber-600 focus:outline-none focus:ring-1 focus:ring-amber-600; }
            .btn { @apply rounded-lg bg-amber-700 px-5 py-2 font-semibold text-amber-50 hover:bg-amber-600 focus:outline-none focus:ring-2 focus:ring-amber-500; }
            .btn-sec { @apply rounded-lg border border-amber-900/60 px-3 py-1 text-sm text-amber-200 hover:bg-stone-800; }
            .tarjeta { @apply relative rounded-xl border border-amber-900/50 bg-stone-900 p-6 shadow-lg shadow-amber-950/40; }
        }
    </style>
</head>
<body class="bg-stone-950 text-stone-100">
    <main class="mx-auto flex min-h-screen max-w-md flex-col justify-center space-y-6 p-4 py-8">
        <header class="text-center">
            <span class="text-3xl font-semibold text-amber-600">Barbería Estilo</span>
        </header>

        <section class="tarjeta">
            <div class="pointer-events-none absolute inset-2 rounded-lg border border-dashed border-amber-700/50"></div>
            <div class="relative space-y-4">
                <div>
                    <h1 class="text-xl font-semibold text-amber-200">Crear cuenta</h1>
                    <p class="mt-1 text-sm text-stone-400">Para guardar tu historial de citas</p>
                </div>

                <form class="space-y-4" novalidate onsubmit="return false">
                    <div>
                        <label for="nombre" class="etiqueta">Nombre completo</label>
                        <input id="nombre" type="text" autocomplete="name" class="campo">
                    </div>
                    <div>
                        <label for="telefono" class="etiqueta">Teléfono</label>
                        <input id="telefono" type="tel" autocomplete="tel" placeholder="10 dígitos" class="campo">
                    </div>
                    <div>
                        <label for="correo" class="etiqueta">Correo</label>
                        <input id="correo" type="email" autocomplete="email" class="campo">
                    </div>
                    <div>
                        <label for="pass" class="etiqueta">Contraseña</label>
                        <input id="pass" type="password" autocomplete="new-password" class="campo">
                    </div>
                    <div>
                        <label for="pass2" class="etiqueta">Confirmar contraseña</label>
                        <input id="pass2" type="password" autocomplete="new-password" class="campo">
                    </div>
                    <button type="submit" class="btn w-full">Registrarme</button>
                </form>

                <p class="text-sm text-stone-400">¿Ya tienes cuenta? <a href="InicioDeSesion.html" class="text-amber-500 hover:text-amber-400">Inicia sesión</a></p>
            </div>
        </section>
    </main>
</body>
</html>
