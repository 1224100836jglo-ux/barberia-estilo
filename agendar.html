<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar cita | Barbería Estilo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
        @layer components {
            .etiqueta { @apply block text-sm text-amber-100; }
            .campo { @apply mt-1 w-full rounded-lg border border-amber-900/60 bg-stone-800 p-2 text-white placeholder-stone-500 focus:border-amber-600 focus:outline-none focus:ring-1 focus:ring-amber-600; }
            .btn { @apply rounded-lg bg-amber-700 px-5 py-2 font-semibold text-amber-50 hover:bg-amber-600 focus:outline-none focus:ring-2 focus:ring-amber-500; }
            .btn-sec { @apply rounded-lg border border-amber-900/60 px-3 py-1 text-sm text-amber-200 hover:bg-stone-800; }
            .tarjeta { @apply relative rounded-xl border border-amber-900/50 bg-stone-900 p-6 shadow-lg shadow-amber-950/40; }
        }
    </style>
</head>
<body class="bg-stone-950 text-stone-100">
    <nav class="border-b border-amber-900/50 bg-stone-900">
        <div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-2 p-4">
            <span class="text-xl font-semibold text-amber-600">Barbería Estilo</span>
            <div class="flex flex-wrap gap-4 text-sm text-stone-300">
                <a href="agendar.html" class="font-semibold text-amber-400">Agendar cita</a>
                <a href="mis-citas.html" class="hover:text-amber-500">Mis citas</a>
                <a href="InicioDeSesion.html" class="text-amber-500 hover:text-amber-400">Cerrar sesión</a>
            </div>
        </div>
    </nav>

    <main class="mx-auto max-w-3xl space-y-6 p-4 py-8">
        <header>
            <h1 class="text-2xl font-semibold text-amber-200">Agendar cita</h1>
            <p class="text-sm text-stone-400">Elige servicio, barbero, fecha y hora disponible</p>
        </header>

        <form class="space-y-6" novalidate onsubmit="return false">
            <section class="tarjeta grid gap-4 sm:grid-cols-2">
                <div>
                    <label for="servicio" class="etiqueta">Servicio</label>
                    <select id="servicio" class="campo">
                        <option>Corte clásico — $120 · 30 min</option>
                        <option>Barba — $80 · 20 min</option>
                        <option>Combo completo — $180 · 50 min</option>
                    </select>
                </div>
                <div>
                    <label for="barbero" class="etiqueta">Barbero</label>
                    <select id="barbero" class="campo">
                        <option>Sin preferencia</option>
                        <option>Barbero 1</option>
                        <option>Barbero 2</option>
                    </select>
                </div>
                <div class="sm:col-span-2">
                    <label for="fecha" class="etiqueta">Fecha</label>
                    <input id="fecha" type="date" class="campo">
                </div>
            </section>

            <section class="tarjeta">
                <h2 class="text-lg font-semibold text-amber-200">Horarios disponibles</h2>
                <div class="mt-3 grid grid-cols-3 gap-2 sm:grid-cols-4">
                    <label class="cursor-pointer"><input type="radio" name="hora" class="peer sr-only" checked>
                        <span class="block rounded-lg border border-amber-900/60 p-2 text-center text-sm peer-checked:bg-amber-700 peer-checked:text-amber-50 peer-focus:ring-2 peer-focus:ring-amber-500">10:00</span></label>
                    <label class="cursor-pointer"><input type="radio" name="hora" class="peer sr-only">
                        <span class="block rounded-lg border border-amber-900/60 p-2 text-center text-sm peer-checked:bg-amber-700 peer-checked:text-amber-50 peer-focus:ring-2 peer-focus:ring-amber-500">10:30</span></label>
                    <label class="cursor-pointer"><input type="radio" name="hora" class="peer sr-only">
                        <span class="block rounded-lg border border-amber-900/60 p-2 text-center text-sm peer-checked:bg-amber-700 peer-checked:text-amber-50 peer-focus:ring-2 peer-focus:ring-amber-500">11:30</span></label>
                    <label class="cursor-pointer"><input type="radio" name="hora" class="peer sr-only">
                        <span class="block rounded-lg border border-amber-900/60 p-2 text-center text-sm peer-checked:bg-amber-700 peer-checked:text-amber-50 peer-focus:ring-2 peer-focus:ring-amber-500">12:00</span></label>
                    <span class="block rounded-lg border border-stone-800 p-2 text-center text-sm text-stone-600 line-through">13:00</span>
                    <span class="block rounded-lg border border-stone-800 p-2 text-center text-sm text-stone-600 line-through">13:30</span>
                </div>
            </section>

            <div class="flex justify-end gap-3">
                <a href="mis-citas.html" class="btn-sec self-center">Cancelar</a>
                <button type="submit" class="btn">Confirmar cita</button>
            </div>
        </form>
    </main>
</body>
</html>
