{% extends 'base.html' %}
{% block titulo %}Iniciar sesión{% endblock %}

{% block contenido %}
<main class="mx-auto flex min-h-screen max-w-md flex-col justify-center space-y-6 p-4 py-8">
    <header class="text-center">
        <div class="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-amber-500 text-3xl">💈</div>
        <p class="mt-3 text-2xl font-bold">BARBERÍA <span class="font-serif italic text-amber-500">Estilo</span></p>
        <p class="mt-1 text-sm text-neutral-400">Reserva tu cita en línea</p>
    </header>

    <section class="tarjeta">
        <h1 class="text-xl font-semibold">Iniciar sesión</h1>
        <p class="mt-1 text-sm text-neutral-400">Entra con tu correo y contraseña</p>

        <form method="post" class="mt-4 space-y-4">
             <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label for="correo" class="etiqueta">Correo</label>
                <input id="correo" name="correo" type="email" required autocomplete="username"
                       value="{{ request.form.get('correo', '') }}" placeholder="correo@ejemplo.com" class="campo">
            </div>
            <div>
                <label for="password" class="etiqueta">Contraseña</label>
                <div class="relative">
                    <input id="password" name="password" type="password" required autocomplete="current-password" class="campo pr-20">
                    <button type="button" id="verPassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-neutral-400 hover:text-amber-500">Mostrar</button>
                </div>
            </div>
            <button type="submit" class="btn w-full">Iniciar sesión</button>
        </form>

        <div class="mt-4 space-y-1 text-sm text-neutral-400">
    <p><a href="/recuperar" class="text-amber-500 hover:text-amber-400">¿Olvidaste tu contraseña?</a></p>
    <p>¿Eres nuevo? <a href="/registro" class="text-amber-500 hover:text-amber-400">Crea tu cuenta</a></p>
</div>

<script>
    const campo = document.getElementById('password');
    const boton = document.getElementById('verPassword');
    boton.addEventListener('click', () => {
        const visible = campo.type === 'text';
        campo.type = visible ? 'password' : 'text';
        boton.textContent = visible ? 'Mostrar' : 'Ocultar';
    });
</script>
{% endblock %}
