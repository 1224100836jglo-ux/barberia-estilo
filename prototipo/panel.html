<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda del día | Barbería Estilo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
        @layer components {
            .etiqueta { @apply block text-sm text-slate-300; }
            .campo { @apply mt-1 w-full rounded-lg border border-slate-700 bg-slate-800 p-2 text-white placeholder-slate-500 focus:border-red-600 focus:outline-none focus:ring-1 focus:ring-red-600; }
            .btn { @apply rounded-lg bg-red-800 px-5 py-2 font-semibold text-white hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500; }
            .btn-sec { @apply rounded-lg border border-slate-700 px-3 py-1 text-sm text-slate-100 hover:bg-slate-800; }
            .tarjeta { @apply relative rounded-xl border border-slate-700 bg-slate-900 p-6 shadow-lg shadow-black/40; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100">
    <nav class="border-b border-slate-700 bg-slate-900">
        <div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-2 p-4">
            <span class="text-xl font-semibold text-red-600">Barbería Estilo</span>
            <div class="flex flex-wrap gap-4 text-sm text-slate-300">
                <a href="panel.html" class="font-semibold text-red-400">Citas</a>
                <a href="servicios.html" class="hover:text-white0">Servicios</a>
                <a href="usuarios.html" class="hover:text-white0">Usuarios</a>
                <a href="InicioDeSesion.html" class="text-white0 hover:text-red-400">Cerrar sesión</a>
            </div>
        </div>
    </nav>

    <main class="mx-auto max-w-5xl space-y-6 p-4 py-8">
        <header class="flex flex-wrap items-end justify-between gap-3">
            <div>
                <h1 class="text-2xl font-semibold text-slate-100">Agenda del día</h1>
                <p class="text-sm text-slate-400">Cambia el estado de cada cita</p>
            </div>
            <div class="flex gap-2">
                <input type="date" aria-label="Fecha" class="campo !mt-0">
                <select aria-label="Filtrar por estado" class="campo !mt-0">
                    <option>Todos</option><option>Pendiente</option><option>Confirmada</option><option>Completada</option><option>Cancelada</option>
                </select>
            </div>
        </header>

        <section class="tarjeta !p-0 overflow-x-auto">
            <table class="w-full min-w-[640px] text-left text-sm">
                <thead class="border-b border-slate-700 text-slate-100">
                    <tr><th class="p-3">Hora</th><th class="p-3">Cliente</th><th class="p-3">Servicio</th><th class="p-3">Barbero</th><th class="p-3">Estado</th></tr>
                </thead>
                <tbody class="divide-y divide-slate-800">
                    <tr>
                        <td class="p-3">10:00</td><td class="p-3">Juan Pérez</td><td class="p-3">Corte clásico</td><td class="p-3">Barbero 1</td>
                        <td class="p-3"><select class="campo !mt-0 !p-1"><option>Pendiente</option><option>Confirmada</option><option>Completada</option><option>Cancelada</option></select></td>
                    </tr>
                    <tr>
                        <td class="p-3">10:30</td><td class="p-3">Luis Gómez</td><td class="p-3">Combo completo</td><td class="p-3">Barbero 2</td>
                        <td class="p-3"><select class="campo !mt-0 !p-1"><option>Pendiente</option><option selected>Confirmada</option><option>Completada</option><option>Cancelada</option></select></td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
