<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña | Barbería Estilo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
        @layer components {
            .etiqueta { @apply block text-sm text-slate-300; }
            .campo { @apply mt-1 w-full rounded-lg border border-slate-700 bg-slate-800 p-2 text-white placeholder-slate-500 focus:border-red-600 focus:outline-none focus:ring-1 focus:ring-red-600; }
            .btn { @apply rounded-lg bg-red-800 px-5 py-2 font-semibold text-white hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500; }
            .btn-sec { @apply rounded-lg border border-slate-700 px-3 py-1 text-sm text-slate-100 hover:bg-slate-800; }
            .tarjeta { @apply relative rounded-xl border border-slate-700 bg-slate-900 p-6 shadow-lg shadow-black/40; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100">
    <main class="mx-auto flex min-h-screen max-w-md flex-col justify-center space-y-6 p-4 py-8">
        <header class="text-center">
            <span class="text-3xl font-semibold text-red-600">Barbería Estilo</span>
        </header>

        <section class="tarjeta">
            <div class="pointer-events-none absolute inset-2 rounded-lg border border-dashed border-red-900/60"></div>
            <div class="relative space-y-4">
                <div>
                    <h1 class="text-xl font-semibold text-slate-100">Recuperar contraseña</h1>
                    <p class="mt-1 text-sm text-slate-400">Te enviaremos un enlace a tu correo</p>
                </div>
                <form class="space-y-4" novalidate onsubmit="return false">
                    <div>
                        <label for="correo" class="etiqueta">Correo</label>
                        <input id="correo" type="email" class="campo">
                    </div>
                    <button type="submit" class="btn w-full">Enviar enlace</button>
                </form>
                <a href="InicioDeSesion.html" class="text-sm text-white0 hover:text-red-400">← Volver a iniciar sesión</a>
            </div>
        </section>
    </main>
</body>
</html>
