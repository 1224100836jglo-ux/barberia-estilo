{% extends 'base.html' %}
{% block titulo %}Crear cuenta{% endblock %}

{% block contenido %}
<main class="mx-auto flex min-h-screen max-w-md flex-col justify-center space-y-6 p-4 py-8">
    <header class="text-center">
        <div class="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-amber-500 text-3xl">💈</div>
        <p class="mt-3 text-2xl font-bold">BARBERÍA <span class="font-serif italic text-amber-500">Estilo</span></p>
    </header>

    <section class="tarjeta">
        <h1 class="text-xl font-semibold">Crear cuenta</h1>
        <p class="mt-1 text-sm text-neutral-400">Para guardar tu historial de citas</p>

        <form method="post" class="mt-4 space-y-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label for="nombre" class="etiqueta">Nombre completo</label>
                <input id="nombre" name="nombre" type="text" required autocomplete="name" value="{{ request.form.get('nombre', '') }}" class="campo">
            </div>
            <div>
                <label for="telefono" class="etiqueta">Teléfono</label>
                <input id="telefono" name="telefono" type="tel" required autocomplete="tel" value="{{ request.form.get('telefono', '') }}" placeholder="10 dígitos" class="campo">
            </div>
            <div>
                <label for="correo" class="etiqueta">Correo</label>
                <input id="correo" name="correo" type="email" required autocomplete="email" value="{{ request.form.get('correo', '') }}" class="campo">
            </div>
            <div>
                <label for="pass" class="etiqueta">Contraseña (mínimo 8 caracteres)</label>
                <input id="pass" name="pass" type="password" required minlength="8" autocomplete="new-password" class="campo">
            </div>
            <div>
                <label for="pass2" class="etiqueta">Confirmar contraseña</label>
                <input id="pass2" name="pass2" type="password" required minlength="8" autocomplete="new-password" class="campo">
            </div>
            <button type="submit" class="btn w-full">Registrarme</button>
        </form>

        <p class="mt-4 text-sm text-neutral-400">¿Ya tienes cuenta? <a href="/login" class="text-amber-500 hover:text-amber-400">Inicia sesión</a></p>
    </section>
</main>
{% endblock %}
